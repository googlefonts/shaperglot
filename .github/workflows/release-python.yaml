name: Build/release Python wheels

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, x86, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      #- name: Install Protoc
      #  uses: arduino/setup-protoc@v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: shaperglot-py
          target: ${{ matrix.target }}
          before-script-linux: |
            case "${{ matrix.target }}" in
              "aarch64" | "armv7" | "s390x" | "ppc64le")
                sudo apt-get update
                sudo apt-get install -y protobuf-compiler
                ;;
              "x86" | "x86_64")
                yum update -y
                yum install -y protobuf-compiler
                ;;
            esac
          args: --release --out ../dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.target }}
      #- name: Install Protoc
      #  uses: arduino/setup-protoc@v3
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: shaperglot-py
          target: ${{ matrix.target }}
          args: --release --out ../dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        #- name: Install Protoc
        #  uses: arduino/setup-protoc@v3
      #  with:
      #    repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: shaperglot-py
          target: ${{ matrix.target }}
          args: --release --out ../dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  pyodide:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # https://pyodide.org/en/stable/project/changelog.html
        version:
          - python: '3.12'
            emscripten: 3.1.58  # pyodide 0.27.* 0.26.*
          - python: '3.11'
            emscripten: 3.1.46  # pyodide 0.25.*
          - python: '3.11'
            emscripten: 3.1.45  # pyodide 0.24.*
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly
          target: wasm32-unknown-emscripten
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.version.python }}
      - name: Install emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install ${{ matrix.version.emscripten }}
          ./emsdk activate ${{ matrix.version.emscripten }}
          source ./emsdk_env.sh
          which emcc
          emcc --version
      - name: Add emcc to PATH
        run: echo "/home/runner/work/shaperglot/shaperglot/emsdk/upstream/emscripten" >> $GITHUB_PATH
      # Install modern version of binaryen (contains wasm-opt) to allow for a flag that cargo uses but can't be influenced.
      # Because the wasm-opt version that ships with emsdk is too old.
      # Since I can't influence the PATH of the emsdk (I tried), I have to replace the version that ships with emsdk.
      - name: Install specific version of binaryen
        run: |
          BINARYEN_VERSION=122
          wget https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz
          tar -xzf binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz
          sudo cp -r binaryen-version_$BINARYEN_VERSION/* /usr/local/
          which wasm-opt
          wasm-opt --version
          rm /home/runner/work/shaperglot/shaperglot/emsdk/upstream/bin/wasm-opt
          ln -s /usr/local/bin/wasm-opt /home/runner/work/shaperglot/shaperglot/emsdk/upstream/bin/wasm-opt
      - name: Build
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          pip install maturin
          mkdir dist
          cd shaperglot-py
          maturin build -i python${{ matrix.version.python }} --strip --release --target wasm32-unknown-emscripten -o ../dist
      - name: Upload Pyodide wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-pyodide-${{ matrix.version.python }}-${{ matrix.version.emscripten }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: shaperglot-py
          command: sdist
          args: --out ../dist
      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist

  consolidate:
    needs: [linux, windows, macos, pyodide, sdist]
    name: Consolidate wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          pattern: wheels-*
          name: wheels

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: consolidate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wheels
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Repack Windows wheels, avoids zip errors
        run: |
            pip install -U wheel twine
            rm *emscripten*.whl || true
            VERSION=${GITHUB_REF/refs\/tags\/v/}
            for i in *win*whl; do wheel unpack $i; wheel pack shaperglot-$VERSION; rm -rf shaperglot-$VERSION; done
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=shaperglot--pypi \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=shaperglot--pypi \
              --quiet || true
          done
      - name: Publish to OSS Exit Gate
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set +x
          export TWINE_USERNAME="oauth2accesstoken"
          export TWINE_PASSWORD="$(gcloud auth print-access-token)"
          twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/shaperglot--pypi/ \
            --non-interactive \
            --skip-existing \
            *.whl *.tar.gz
          unset TWINE_PASSWORD
          printf '{"publish_all": true}\n' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/shaperglot/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
