[workspace]
resolver = "2"

members = [
    "shaperglot-lib",
    "shaperglot-cli",
    "shaperglot-web",
    "shaperglot-py",
]

default-members = ["shaperglot-lib", "shaperglot-cli"]

[workspace.dependencies]
skrifa = "0.42.0"
harfrust = "0.6"
itertools = "0.14.0"
google-fonts-languages = "0.7.9"
toml = { version = "0.9.5", default-features = false, features = ["parse", "serde"] }
serde_json = { version = "1.0.142", features = ["preserve_order"] }

[workspace.lints.clippy]
uninlined_format_args = "allow"
