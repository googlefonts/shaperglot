<!DOCTYPE html>
<html lang="en" dir="auto">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Shaperglot!</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
    crossorigin="anonymous"></script>
  <style type="text/css">
    @font-face {
      font-family: "Test Font";
      src: url();
    }

    .testfont {
      font-variation-settings: "wght" 400, "wdth" 100;
      font-family: "Test Font", "Adobe Notdef";
      font-size: 1.4em !important;
    }

    :root {
      --node-pt-size: 60px;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="modal" tabindex="-1" id="bigLoadingModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="d-flex justify-content-center">
          <div class="spinner-border" role="status">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" tabindex="-1" id="spinnerModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="d-flex justify-content-center">
          <div class="spinner-border" role="status">
            <span class="sr-only">Working...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal" tabindex="-1" id="startModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <div class="container h-100">
            <div id="fontbefore" class="h-100 p-4 d-flex fontdrop">
              <div class="align-self-center mx-auto text-center">
                <h2>Drop font here to show language coverage</h2>
                <p class="mb-3 mt-3">or</p>
                <label for="fontfile" class="btn btn-primary btn-lg">
                  Browse for a font file
                </label>
                <input type="file" id="fontfile" class="sr-only"
                  accept=".ttf,.otf,font/ttf,font/otf,application/x-font-ttf,application/x-font-opentype" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="">
    <div class="m-5 d-flex flex-column vh-100 mh-100 " id="app">
      <h1>Shaperglot</h1>
      <p>A tool for evaluating language coverage, based on the
        <a href="https://github.com/googlefonts/lang">Google Fonts Language Database</a>
      </p>
      <h2 id="filename" class="d-none">Test file</h2>

      <div class=" row  flex-grow-1" id="results">
        <div class="col-12 col-md-4 active" id="coverage-panel">
          <div class="p-2" id="searchfilter">
            <input type="search" id="searchbox" class="form-control mb-2"
              placeholder="Search languages (name, ISO code, autonym, region)"
              aria-label="Search languages" />
            <div class="d-flex flex-wrap" id="statusfilter" role="group"
              aria-label="Filter by support status">
              <button type="button" class="btn btn-sm btn-outline-secondary active"
                data-status="">All</button>
              <button type="button" class="btn btn-sm btn-outline-secondary"
                data-status="Complete">Complete</button>
              <button type="button" class="btn btn-sm btn-outline-secondary"
                data-status="Supported">Supported</button>
              <button type="button" class="btn btn-sm btn-outline-secondary"
                data-status="Incomplete">Incomplete</button>
              <button type="button" class="btn btn-sm btn-outline-secondary"
                data-status="Unsupported">Unsupported</button>
              <button type="button" class="btn btn-sm btn-outline-secondary"
                data-status="None">None</button>
            </div>
          </div>
          <div class="accordion flex-grow-1 overflow-auto" id="scriptlist">
          </div>
        </div>
        <div class="col-12 col-md-8 overflow-auto" id="details-panel">
          <div class="tab-content" id="language-content">
            <div class="tab-pane show active m-2" role="tabpanel">
            </div>
          </div>
        </div>
      </div>
    </div>

  <nav class="d-md-none fixed-bottom bg-white" id="mobiletabs" aria-label="Mobile navigation">
    <div class="btn-group btn-group-lg d-flex" role="group">
      <button type="button" class="btn btn-primary" data-panel="coverage">Coverage</button>
      <button type="button" class="btn btn-secondary" data-panel="details">Details</button>
    </div>
  </nav>

</body>
<script src="./bootstrap.js"></script>

</html>

</html>
